name: Forge

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: nightly # Catch upstream Foundry changes before the next stable release.
      - name: Lint contracts and verification harnesses
        run: forge lint src certora --deny notes
      - name: Lint tests
        run: forge lint test --deny notes

  fmt:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: nightly # Catch upstream Foundry changes before the next stable release.
      - run: forge fmt src test certora --check

  sizes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: nightly # Catch upstream Foundry changes before the next stable release.
      - run: forge build --sizes
      - name: Check foundry.lock matches submodule pins
        run: forge build --locked

  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: nightly # Catch upstream Foundry changes before the next stable release.
      - run: forge test --deny warnings -vvv
        env:
          FOUNDRY_FUZZ_SEED: 0x${{ github.sha }}
          FOUNDRY_FUZZ_RUNS: 10000
          FOUNDRY_FUZZ_MAX_TEST_REJECTS: 500000
          FOUNDRY_INVARIANT_RUNS: 10000
          FOUNDRY_INVARIANT_DEPTH: 32
