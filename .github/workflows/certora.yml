name: Certora

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      confs: ${{ steps.list.outputs.confs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "confs=$(find certora/confs -type f -name '*.conf' | sed 's|^certora/confs/||;s|\.conf$||' | sort | jq -nRc '[inputs]')" >> "$GITHUB_OUTPUT"

  format:
    name: Certora formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - run: pip install certora-cli==8.20.3
      - name: Check every config and spec, including shared helpers
        run: |
          formatted="$(mktemp)"
          trap 'rm -f "$formatted"' EXIT
          while IFS= read -r -d '' file; do
            jq . "$file" > "$formatted"
            diff -u "$file" "$formatted"
          done < <(find certora/confs -type f -name '*.conf' -print0 | sort -z)
          while IFS= read -r -d '' file; do
            certoraCVLFormatter "$file" | sed 's/[[:blank:]]*$//' > "$formatted"
            diff -u "$file" "$formatted"
          done < <(find certora -type f -name '*.spec' -print0 | sort -z)

  verify:
    needs: [matrix, format]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        conf: ${{ fromJson(needs.matrix.outputs.confs) }}

    steps:
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - run: pip install certora-cli==8.20.3

      - name: Install solc (0.8.19)
        run: |
          wget https://github.com/ethereum/solidity/releases/download/v0.8.19/solc-static-linux
          echo "7805ee2c1e70f2004eeb514f98a18d8260644c2f4bbf2e50f7f92e24b9ec2dbdc3e96ccbfe2570912f48bf0611b885594d2a6635527bc53d811dd56fb596e41b  solc-static-linux" | sha512sum --check --strict -
          chmod +x solc-static-linux
          sudo mv solc-static-linux /usr/local/bin/solc-0.8.19

      - name: Install solc (0.8.27)
        run: |
          wget https://github.com/ethereum/solidity/releases/download/v0.8.27/solc-static-linux
          echo "6550177d642061f1698cc724e7dad063f44bb85e6b4cb54cbc86530452ac9e1f02c9b573eb640167aa972e0592985d9464e55e4efb2894ec7cd3cbba0cae2729  solc-static-linux" | sha512sum --check --strict -
          chmod +x solc-static-linux
          sudo mv solc-static-linux /usr/local/bin/solc-0.8.27

      - run: certoraRun "certora/confs/$CONF.conf"
        env:
          CONF: ${{ matrix.conf }}
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
