[profile.default]
ignored_warnings_from = ["lib"]
libs = ["lib"]
names = true
sizes = true
via_ir = true
optimizer = true
optimizer_runs = 999999
bytecode_hash = "none"
evm_version = "cancun"
gas_limit = 4294967295
additional_compiler_profiles = [
    { name = "paris", evm_version = "paris" },
]
compilation_restrictions = [
    { paths = "src/Morpho.sol", evm_version = "paris" },
    { paths = "src/periphery/adaptive-curve-irm/**", evm_version = "paris" },
]

[profile.default.invariant]
runs = 1024
depth = 32
fail_on_revert = true

[lint]
exclude_lints = [
    "arbitrary-send-erc20",
    "arbitrary-send-eth",
    "asm-keccak256",
    "block-timestamp",
    "boolean-cst",
    "calls-loop",
    "costly-loop",
    "custom-errors",
    "cyclomatic-complexity",
    "divide-before-multiply",
    "ecrecover",
    "encode-packed-collision",
    "erc20-unchecked-transfer",
    "incorrect-shift",
    "inline-assembly",
    "internal-function-used-once",
    "literal-instead-of-constant",
    "low-level-calls",
    "missing-events-access-control",
    "missing-zero-check",
    "mixed-case-variable",
    "multi-contract-file",
    "pragma-inconsistent",
    "reentrancy-events",
    "reentrancy-no-eth",
    "require-revert-in-loop",
    "screaming-snake-case-const",
    "screaming-snake-case-immutable",
    "solmate-safe-transfer-lib",
    "too-many-digits",
    "unaliased-plain-import",
    "uninitialized-local",
    "unsafe-cheatcode",
    "unsafe-typecast",
    "unused-import",
    "unused-return",
    "unwrapped-modifier-logic",
]
ignore = ['test/**/*.sol']

[profile.no_via_ir]
via_ir = false
