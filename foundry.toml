[profile.default]
libs = ["lib"]
names = true
sizes = true
via_ir = true
optimizer = true
optimizer_runs = 999999
bytecode_hash = "none"
evm_version = "cancun"
gas_limit = 4294967295
additional_compiler_profiles = [
    { name = "paris", evm_version = "paris" },
]
compilation_restrictions = [
    { paths = "src/Morpho.sol", evm_version = "paris" },
    { paths = "src/periphery/adaptive-curve-irm/**", evm_version = "paris" },
]

[profile.default.invariant]
runs = 1024
depth = 32
fail_on_revert = true

[profile.default.fmt]
wrap_comments = true

[lint]
exclude_lints = [
    "unaliased-plain-import",
    "asm-keccak256",
    "unwrapped-modifier-logic",
    "unsafe-typecast",
    "block-timestamp",
    # Existing implementation baseline; enabling CI must preserve audited bytecode.
    "arbitrary-send-erc20",
    "calls-loop",
    "divide-before-multiply",
    "ecrecover",
    "encode-packed-collision",
    "missing-zero-check",
    "reentrancy-events",
    "reentrancy-no-eth",
    "require-revert-in-loop",
    "solmate-safe-transfer-lib",
    "uninitialized-local",
    "unused-return",
]
ignore = ['test/**/*.sol']

[profile.no_via_ir]
via_ir = false

# Test-only baseline. Lists replace rather than extend the default exclusions.
[profile.lint-test.lint]
exclude_lints = [
    "unaliased-plain-import",
    "asm-keccak256",
    "unwrapped-modifier-logic",
    "unsafe-typecast",
    "block-timestamp",
    "arbitrary-send-erc20",
    "calls-loop",
    "divide-before-multiply",
    "ecrecover",
    "encode-packed-collision",
    "missing-zero-check",
    "reentrancy-events",
    "reentrancy-no-eth",
    "require-revert-in-loop",
    "solmate-safe-transfer-lib",
    "uninitialized-local",
    "unused-return",
    "environment-read-across-mutation",
]
