[profile.default]
libs = ["lib"]
names = true
sizes = true
via_ir = true
optimizer = true
optimizer_runs = 999999
bytecode_hash = "none"
evm_version = "cancun"
gas_limit = 4294967295
additional_compiler_profiles = [
    { name = "paris", evm_version = "paris" },
]
compilation_restrictions = [
    { paths = "src/Morpho.sol", evm_version = "paris" },
    { paths = "src/periphery/adaptive-curve-irm/**", evm_version = "paris" },
]

[profile.default.invariant]
runs = 1024
depth = 32
fail_on_revert = true

[profile.default.fmt]
wrap_comments = true

[lint]
exclude_lints = [
    "arbitrary-send-erc20",
    "arbitrary-send-eth",
    "asm-keccak256",
    "block-timestamp",
    "boolean-cst",
    "calls-loop",
    "costly-loop",
    "custom-errors",
    "cyclomatic-complexity",
    "divide-before-multiply",
    "ecrecover",
    "encode-packed-collision",
    "erc20-unchecked-transfer",
    "incorrect-shift",
    "inline-assembly",
    "internal-function-used-once",
    "literal-instead-of-constant",
    "low-level-calls",
    "missing-events-access-control",
    "missing-zero-check",
    "mixed-case-variable",
    "multi-contract-file",
    "pragma-inconsistent",
    "reentrancy-events",
    "reentrancy-no-eth",
    "require-revert-in-loop",
    "screaming-snake-case-const",
    "screaming-snake-case-immutable",
    "solmate-safe-transfer-lib",
    "too-many-digits",
    "unaliased-plain-import",
    "uninitialized-local",
    "unsafe-cheatcode",
    "unsafe-typecast",
    "unused-import",
    "unused-return",
    "unwrapped-modifier-logic",
]
ignore = ['test/**/*.sol']

[profile.no_via_ir]
via_ir = false

# Lint test/ as ordinary Solidity instead of applying Forge's test-only rule filter.
[profile.lint-test]
test = ".forge-lint-unused"

[profile.lint-test.lint]
exclude_lints = [
    "arbitrary-send-erc20",
    "arbitrary-send-eth",
    "asm-keccak256",
    "block-timestamp",
    "boolean-cst",
    "calls-loop",
    "costly-loop",
    "custom-errors",
    "cyclomatic-complexity",
    "divide-before-multiply",
    "ecrecover",
    "empty-block",
    "encode-packed-collision",
    "environment-read-across-mutation",
    "erc20-unchecked-transfer",
    "function-init-state",
    "incorrect-shift",
    "inline-assembly",
    "internal-function-used-once",
    "literal-instead-of-constant",
    "locked-ether",
    "low-level-calls",
    "missing-events-access-control",
    "missing-inheritance",
    "missing-zero-check",
    "mixed-case-variable",
    "multi-contract-file",
    "named-struct-fields",
    "pragma-inconsistent",
    "reentrancy-events",
    "reentrancy-no-eth",
    "require-revert-in-loop",
    "return-bomb",
    "screaming-snake-case-const",
    "screaming-snake-case-immutable",
    "solmate-safe-transfer-lib",
    "too-many-digits",
    "unaliased-plain-import",
    "uninitialized-local",
    "uninitialized-state",
    "unsafe-cheatcode",
    "unsafe-typecast",
    "unused-import",
    "unused-return",
    "unwrapped-modifier-logic",
]
