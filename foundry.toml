[profile.default]
ignored_warnings_from = ["lib"]
libs = ["lib"]
names = true
sizes = true
via_ir = true
optimizer = true
optimizer_runs = 999999
bytecode_hash = "none"
evm_version = "cancun"
gas_limit = 4294967295
additional_compiler_profiles = [
    { name = "paris", evm_version = "paris" },
]
compilation_restrictions = [
    { paths = "src/Morpho.sol", evm_version = "paris" },
    { paths = "src/periphery/adaptive-curve-irm/**", evm_version = "paris" },
]

[profile.default.invariant]
runs = 1024
depth = 32
fail_on_revert = true

[lint]
exclude_lints = [
    "unaliased-plain-import",
    "asm-keccak256",
    "unwrapped-modifier-logic",
    "unsafe-typecast",
    "block-timestamp",
    "reentrancy-events",
    "uninitialized-local",
    "unused-return",
    "solmate-safe-transfer-lib",
    "missing-zero-check",
    "reentrancy-no-eth",
    "encode-packed-collision",
    "ecrecover",
    "divide-before-multiply",
    "arbitrary-send-erc20",
]
ignore = ['test/**/*.sol']

[profile.no_via_ir]
via_ir = false
